name = "leanblame"
version = "0.1.0"
defaultTargets = ["LeanBlameAttr", "leanblame"]

# The `@[trusted]` attribute. Imports only Lean, never Lake, so libraries that
# tag declarations do not pull Lake into their import closure.
[[lean_lib]]
name = "LeanBlameAttr"
roots = ["LeanBlame.Attr"]

# The command-line tool. It imports the libraries it reads with their environment extensions,
# which runs their initializers in Lean's interpreter, as doc-gen4 does.
[[lean_exe]]
name = "leanblame"
root = "Main"
supportInterpreter = true

# The executable's own modules: the generic core and the Lean frontend
# (docs/design/04-architecture.md, "The CLI"). Lake builds an executable's imports only from
# library targets, so they need one. Internal: user libraries never import it.
[[lean_lib]]
name = "LeanBlameCli"
globs = ["LeanBlame.Core.+", "LeanBlame.Lean.+"]
